syntax = "proto3";

package category;

service CategoryService {
  rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse);
  rpc GetCategory(GetCategoryRequest) returns (CategoryResponse);
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteResponse);
}

message CreateCategoryRequest {
  string name = 1;
  string description = 2;
  string slug = 3;
  optional string parentId = 4;
  string status = 5;
  optional string imageUrl = 6;
  optional int32 sortOrder = 7;
  optional bool isVisible = 8;
  optional bool allowSubcategories = 9;
  optional SEOData seoData = 10;
  optional string createdBy = 11;
}

message UpdateCategoryRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string slug = 4;
  optional string parentId = 5;
  optional string status = 6;
  optional string imageUrl = 7;
  optional int32 sortOrder = 8;
  optional bool isVisible = 9;
  optional bool allowSubcategories = 10;
  optional SEOData seoData = 11;
  optional string updatedBy = 12;
}

message GetCategoryRequest {
  string id = 1;
}

message GetCategoriesRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional string status = 3;
  optional string parentId = 4;
  optional string search = 5;
}

message DeleteCategoryRequest {
  string id = 1;
}

message SEOData {
  optional string metaTitle = 1;
  optional string metaDescription = 2;
  repeated string keywords = 3;
}

message CategoryResponse {
  bool success = 1;
  string message = 2;
  optional CategoryData data = 3;
}

message CategoryData {
  string id = 1;
  string name = 2;
  string description = 3;
  string slug = 4;
  optional string parentId = 5;
  string status = 6;
  optional string imageUrl = 7;
  int32 sortOrder = 8;
  bool isVisible = 9;
  bool allowSubcategories = 10;
  optional SEOData seoData = 11;
  string createdAt = 12;
  string updatedAt = 13;
  optional string createdBy = 14;
  optional string updatedBy = 15;
  optional int32 subcategoriesCount = 16;
  optional int32 productsCount = 17;
}

message GetCategoriesResponse {
  bool success = 1;
  string message = 2;
  repeated CategoryData categories = 3;
  int32 total = 4;
  int32 page = 5;
  int32 limit = 6;
  int32 totalPages = 7;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}


