syntax = "proto3";

package supplierproduct;

service SupplierProductService {
  // ===== Common APIs ====== Supplier, Seller, Admin, Internal
  rpc GetSupplierProducts(GetSupplierProductsRequest) returns (ProductListResponse);

  rpc GetSupplierProductDetail(GetSupplierProductDetailRequest) returns (ProductDetailResponse);


  // ===== Supplier APIs =====

  rpc CreateProduct(CreateProductRequest) returns (ProductResponse);

  rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);

  rpc CreateVariant(CreateVariantRequest) returns (VariantResponse);

  rpc UpdateVariant(UpdateVariantRequest) returns (VariantResponse);

  rpc AddProductImages(AddProductImagesRequest) returns (AddProductImagesResponse);

  rpc PublishProduct(PublishProductRequest) returns (ProductResponse);

  rpc UnpublishProduct(UnpublishProductRequest) returns (ProductResponse);

  rpc ArchiveProduct(ArchiveProductRequest) returns (ProductResponse);

  // ===== Admin APIs =====

  rpc AdminSuspendProduct(AdminSuspendProductRequest) returns (ProductResponse);

  rpc AdminUnsuspendProduct(AdminUnsuspendProductRequest) returns (ProductResponse);


  // ===== Internal APIs =====

  rpc GetVariantsByProductId(GetVariantsByProductIdRequest) returns (VariantListResponse);

  rpc BatchGetVariants(BatchGetVariantsRequest) returns (VariantListResponse);

  rpc UpdateInventorySnapshot(UpdateInventorySnapshotRequest) returns (UpdateInventorySnapshotResponse);
}


// ===== Core Messages =====

message Product {
  string id = 1;
  string supplierId = 2;
  string name = 3;
  string description = 4;
  string categoryId = 5;
  string status = 6;
  map<string,string> specifications = 7;
  repeated string tags = 8;
  double ratingAvg = 9;
  int32 ratingCount = 10;
  bool isFeatured = 11;
  string createdAt = 12;
  string updatedAt = 13;
  string modelGlbUrl = 14;
}

message Variant {
  string id = 1;
  string productId = 2;
  string sku = 3;
  double supplierPrice = 4;
  string currency = 5;
  map<string,string> attributes = 6;
  int32 inventorySnapshot = 7;
}

message ProductImage {
  string id = 1;
  string productId = 2;
  string url = 3;
  string altText = 4;
  bool isPrimary = 5;
  int32 sortOrder = 6;
  int32 width = 7;
  int32 height = 8;
  string variantId = 9;
}

message ProductListItemView {
  string id = 1;
  string supplierId = 2;        // role-based (SUPPLIER/ADMIN/INTERNAL)
  string name = 3;
  string description = 4;
  string categoryId = 5;
  string status = 6;
  string imageUrl = 7;
  int32 totalStock = 8;
  double minSupplierPrice = 9;  // optional semantic: 0 nếu không có variant
  double maxSupplierPrice = 10;
  string currency = 11;         // optional semantic: "" nếu không có
  double ratingAvg = 12;
  int32 ratingCount = 13;
  bool isFeatured = 14;
  string createdAt = 15;
  string updatedAt = 16;
}

// ===== Common API Messages ======

message GetSupplierProductsRequest {
  string keyword = 1;
  string supplierId = 2;
  repeated string statuses = 3;
  int32 page = 4;
  int32 limit = 5;
}

message ProductListResponse {
  repeated ProductListItemView products = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetSupplierProductDetailRequest {
  string productId = 1;
}

// ===== Supplier API Messages =====

message CreateProductVariantItem {
  string sku = 1;
  double supplierPrice = 2;
  string currency = 3;
  map<string,string> attributes = 4;
  int32 inventorySnapshot = 5;
}

message CreateProductRequest {
  string supplierId = 1;
  string name = 2;
  string description = 3;
  string categoryId = 4;
  map<string,string> specifications = 5;
  repeated string tags = 6;
  string status = 7;
  repeated ProductImage images = 8;
  repeated CreateProductVariantItem variants = 9;
  string modelGlbUrl = 10;
}

message ProductResponse {
  Product product = 1;
}

message UpdateProductImagePatchItem {
  string operation = 1; // UPSERT | DELETE
  string id = 2;
  string url = 3;
  string altText = 4;
  bool isPrimary = 5;
  int32 sortOrder = 6;
}

message UpdateProductVariantPatchItem {
  string operation = 1; // UPSERT | DELETE
  string id = 2;
  string sku = 3;
  double supplierPrice = 4;
  string currency = 5;
  map<string,string> attributes = 6;
  int32 inventorySnapshot = 7;
}

message UpdateProductRequest {
  string productId = 1;
  string name = 2;
  string description = 3;
  string categoryId = 4;
  map<string,string> specifications = 5;
  repeated string tags = 6;
  repeated UpdateProductImagePatchItem images = 7;
  repeated UpdateProductVariantPatchItem variants = 8;
  int32 version = 9; // thêm mới ở cuối
  string modelGlbUrl = 10;
}

message CreateVariantRequest {
  string productId = 1;
  string sku = 2;
  double supplierPrice = 3;
  string currency = 4;
  map<string,string> attributes = 5;
  int32 inventorySnapshot = 6;
}

message VariantResponse {
  Variant variant = 1;
}

message UpdateVariantRequest {
  string variantId = 1;
  double supplierPrice = 2;
  string currency = 3;
  int32 inventorySnapshot = 4;
}

message AddProductImagesRequest {
  string productId = 1;
  repeated ProductImage images = 2;
}

message AddProductImagesResponse {
  bool success = 1;
}

message PublishProductRequest {
  string productId = 1;
}

message UnpublishProductRequest {
  string productId = 1;
}

message ProductDetailResponse {
  Product product = 1;
  repeated Variant variants = 2;
  repeated ProductImage images = 3;
}

message ArchiveProductRequest {
  string productId = 1;
  string reason = 2; // optional
}

// ===== Admin API Messages =====

message AdminSuspendProductRequest {
  string productId = 1;
  string reason = 2;
}

message AdminUnsuspendProductRequest {
  string productId = 1;
}


// ===== Internal API Messages =====

message GetVariantsByProductIdRequest {
  string productId = 1;
}

message VariantListResponse {
  repeated Variant variants = 1;
}

message BatchGetVariantsRequest {
  repeated string variantIds = 1;
}

message UpdateInventorySnapshotRequest {
  string variantId = 1;
  int32 inventory = 2;
}

message UpdateInventorySnapshotResponse {
  bool success = 1;
}
